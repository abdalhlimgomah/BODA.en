<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحليلات - BudoQ</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="../assets/fonts/cairo.css" rel="stylesheet">
  <link href="../assets/fonts/material-icons-outlined.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin-content.css">
  <style>
    .analytics-page { max-width: 1200px; margin: 0 auto; padding: 32px 20px; direction: rtl; }
    .analytics-page h1 { font-size: 28px; color: #1a2530; margin-bottom: 8px; }
    .analytics-page .subtitle { color: #64748b; margin-bottom: 32px; }
    .analytics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; margin-bottom: 32px; }
    .analytics-card { background: #fff; border-radius: 16px; padding: 24px; border: 1px solid #f1f5f9; }
    .analytics-card h3 { font-size: 16px; color: #1a2530; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .analytics-card p { color: #64748b; font-size: 14px; margin-bottom: 12px; line-height: 1.6; }
    .analytics-status { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
    .analytics-status.active { background: #dcfce7; color: #16a34a; }
    .analytics-status.inactive { background: #fef2f2; color: #ef4444; }
    .analytics-status.pending { background: #fef9c3; color: #ca8a04; }
    .analytics-settings { background: #fff; border-radius: 16px; padding: 24px; border: 1px solid #f1f5f9; max-width: 600px; }
    .analytics-settings h3 { font-size: 18px; color: #1a2530; margin-bottom: 20px; }
    .analytics-field { margin-bottom: 20px; }
    .analytics-field label { display: block; font-size: 14px; font-weight: 600; color: #1a2530; margin-bottom: 6px; }
    .analytics-field input { width: 100%; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; direction: ltr; text-align: left; box-sizing: border-box; }
    .analytics-field .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .analytics-btn { padding: 10px 24px; background: #1a2530; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .analytics-btn:hover { background: #0f172a; }
    .analytics-integrations { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .analytics-integration { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #f8fafc; border-radius: 10px; }
    .analytics-integration .name { font-weight: 600; color: #1a2530; }
    .analytics-integration .desc { font-size: 13px; color: #64748b; }
  </style>
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <meta property="og:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <meta name="twitter:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
</head>
<body>
  <div id="shell-root"></div>
  <div class="analytics-page">
    <h1>لوحة التحليلات</h1>
    <p class="subtitle">حالة أدوات Google و Microsoft المتصلة بالموقع</p>

    <div class="analytics-grid" id="analytics-grid"></div>
    <div class="analytics-settings" id="analytics-settings"></div>
  </div>
  <div id="shell-footer"></div>

  <script>
    (function () {
      var config = {
        GA4_MEASUREMENT_ID: "G-XXXXXXXXXX",
        GSC_VERIFICATION: "pending",
        BING_VERIFICATION: "pending",
        CLARITY_PROJECT_ID: "pending",
      };

      try {
        var stored = localStorage.getItem("buda_analytics_config");
        if (stored) Object.assign(config, JSON.parse(stored));
      } catch (e) {}

      function renderGrid() {
        var grid = document.getElementById("analytics-grid");
        if (!grid) return;

        var cards = [
          { title: "Google Analytics 4", desc: "تتبع الزوار والسلوك والأحداث", status: config.GA4_MEASUREMENT_ID !== "G-XXXXXXXXXX" && config.GA4_MEASUREMENT_ID !== "pending", icon: "analytics", id: "GA4" },
          { title: "Google Search Console", desc: "مراقبة ظهور الموقع في البحث", status: config.GSC_VERIFICATION !== "pending", icon: "search", id: "GSC" },
          { title: "Bing Webmaster", desc: "إدارة ظهور الموقع في Bing", status: config.BING_VERIFICATION !== "pending", icon: "travel_explore", id: "Bing" },
          { title: "Microsoft Clarity", desc: "تسجيل جلسات المستخدمين", status: config.CLARITY_PROJECT_ID !== "pending", icon: "visibility", id: "Clarity" },
        ];

        grid.innerHTML = cards.map(function (c) {
          var statusClass = c.status ? "active" : "inactive";
          var statusText = c.status ? "متصل" : "غير متصل";
          return '<div class="analytics-card"><h3><span class="material-icons-outlined">' + c.icon + '</span> ' + c.title + '</h3>' +
            '<p>' + c.desc + '</p>' +
            '<div class="analytics-status ' + statusClass + '"><span class="material-icons-outlined" style="font-size:16px">' + (c.status ? "check_circle" : "cancel") + '</span> ' + statusText + '</div></div>';
        }).join("");
      }

      function renderSettings() {
        var container = document.getElementById("analytics-settings");
        if (!container) return;

        container.innerHTML =
          '<h3>إعدادات أدوات التحليلات</h3>' +
          '<div class="analytics-field"><label>Google Analytics 4 ID (Measurement ID)</label><input type="text" id="cfg-ga4" value="' + config.GA4_MEASUREMENT_ID + '" placeholder="G-XXXXXXXXXX"><div class="hint">من حساب Google Analytics → Admin → Data Streams</div></div>' +
          '<div class="analytics-field"><label>Google Search Console — كود التحقق (meta tag)</label><input type="text" id="cfg-gsc" value="' + config.GSC_VERIFICATION + '" placeholder="google-site-verification-code"><div class="hint">من GSC → Settings → Ownership verification → HTML tag</div></div>' +
          '<div class="analytics-field"><label>Bing Webmaster — كود التحقق</label><input type="text" id="cfg-bing" value="' + config.BING_VERIFICATION + '" placeholder="bing-verification-code"><div class="hint">من Bing Webmaster Tools → Configure → Meta tag</div></div>' +
          '<div class="analytics-field"><label>Microsoft Clarity — Project ID</label><input type="text" id="cfg-clarity" value="' + config.CLARITY_PROJECT_ID + '" placeholder="clarity-project-id"><div class="hint">من Clarity → Settings → Project ID</div></div>' +
          '<button class="analytics-btn" onclick="saveConfig()">حفظ الإعدادات</button>' +
          '<div style="margin-top:16px;padding:12px;background:#f8fafc;border-radius:10px;font-size:13px;color:#64748b"><strong>ملاحظة:</strong> بعد الحفظ، يتم تخزين الإعدادات محلياً (localStorage). للتفعيل الكامل، غيّر القيم في <code>assets/js/seo/analytics-manager.js</code></div>' +
          '<div class="analytics-integrations" style="margin-top:24px"><h4 style="margin-bottom:8px">الروابط السريعة</h4>' +
          '<a href="https://analytics.google.com" target="_blank" class="analytics-integration"><div><div class="name">Google Analytics</div><div class="desc">analytics.google.com</div></div><span class="material-icons-outlined">open_in_new</span></a>' +
          '<a href="https://search.google.com/search-console" target="_blank" class="analytics-integration"><div><div class="name">Google Search Console</div><div class="desc">search.google.com/search-console</div></div><span class="material-icons-outlined">open_in_new</span></a>' +
          '<a href="https://www.bing.com/webmasters" target="_blank" class="analytics-integration"><div><div class="name">Bing Webmaster Tools</div><div class="desc">bing.com/webmasters</div></div><span class="material-icons-outlined">open_in_new</span></a>' +
          '<a href="https://clarity.microsoft.com" target="_blank" class="analytics-integration"><div><div class="name">Microsoft Clarity</div><div class="desc">clarity.microsoft.com</div></div><span class="material-icons-outlined">open_in_new</span></a>' +
          '</div>';
      }

      global.saveConfig = function () {
        config.GA4_MEASUREMENT_ID = document.getElementById("cfg-ga4")?.value || "G-XXXXXXXXXX";
        config.GSC_VERIFICATION = document.getElementById("cfg-gsc")?.value || "pending";
        config.BING_VERIFICATION = document.getElementById("cfg-bing")?.value || "pending";
        config.CLARITY_PROJECT_ID = document.getElementById("cfg-clarity")?.value || "pending";
        try { localStorage.setItem("buda_analytics_config", JSON.stringify(config)); } catch (e) {}
        renderGrid();
        alert("تم حفظ الإعدادات");
      };

      renderGrid();
      renderSettings();
    })();
  </script>
  <script src="../assets/js/noon-shell.js"></script>
</body>
</html>
