<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل - مركز المعرفة BudoQ</title>
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="">
  <meta property="og:locale" content="ar_AR">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <meta name="twitter:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="../assets/css/blog.css">
  <link rel="stylesheet" href="../assets/css/noon.css">
  <script src="../assets/js/seo/seo-utils.js"></script>
</head>
<body>
  <header class="app-header"></header>
  <div id="reading-progress-bar" class="reading-progress-bar"></div>
  <div id="shell-root"></div>

  <div class="blog-page" id="guide-page">
    <div class="blog-loading" id="guide-loading">
      <div class="skeleton-loader" style="height:40px;width:50%;margin:0 auto 12px;border-radius:8px"></div>
      <div class="skeleton-loader" style="height:20px;width:30%;margin:0 auto 24px;border-radius:8px"></div>
      <div class="skeleton-loader" style="height:300px;border-radius:16px;margin-bottom:24px"></div>
    </div>
  </div>

  <div id="shell-footer"></div>

  <script src="../assets/js/seo/blog-engine.js"></script>
  <script src="../assets/js/seo/knowledge-center.js"></script>
  <script src="../assets/js/seo/content-engine.js"></script>
  <script src="../assets/js/seo/meta-generator.js"></script>
  <script src="../assets/js/seo/schema-generator.js"></script>
  <script src="../assets/js/seo/seo-engine.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) {
        document.getElementById('guide-page').innerHTML = '<div class="blog-empty"><span class="material-icons-outlined" style="font-size:64px">error_outline</span><p>الدليل غير موجود</p></div>';
        return;
      }

      KnowledgeCenter.getGuideBySlug(slug).then(function (guide) {
        if (!guide) {
          document.getElementById('guide-page').innerHTML = '<div class="blog-empty"><span class="material-icons-outlined" style="font-size:64px">error_outline</span><p>الدليل غير موجود</p></div>';
          return;
        }

        document.getElementById('guide-loading').style.display = 'none';

        var typeLabels = {
          buying: 'دليل شراء', how_to: 'كيفية', top_picks: 'أفضل المنتجات',
          review: 'مراجعة', tutorial: 'درس تعليمي', comparison: 'مقارنة'
        };

        var html = '<header class="post-header">';
        html += '<span class="guide-card-type guide-type-' + guide.guide_type + '" style="display:inline-block">' + (typeLabels[guide.guide_type] || guide.guide_type) + '</span>';
        html += '<h1>' + KnowledgeCenter.escHtml(guide.title) + '</h1>';
        if (guide.subtitle) html += '<p style="color:#64748b;font-size:16px">' + KnowledgeCenter.escHtml(guide.subtitle) + '</p>';
        html += '</header>';

        if (guide.image) html += '<img src="' + guide.image + '" alt="' + KnowledgeCenter.escHtml(guide.title) + '" class="post-featured-image" loading="lazy">';

        html += '<div id="guide-steps-container"></div>';
        html += '<div class="post-content" id="guide-content"></div>';
        html += '<div id="guide-faq"></div>';

        document.getElementById('guide-page').innerHTML = html;

        KnowledgeCenter.renderGuideSteps(guide, 'guide-steps-container');
        KnowledgeCenter.renderGuideContent(guide, 'guide-content');
        KnowledgeCenter.renderGuideFAQ(guide, 'guide-faq');
        BlogEngine.renderReadingProgress();

        document.title = (guide.meta_title || guide.title) + ' | Buda';
        var canon = document.querySelector('link[rel="canonical"]');
        if (canon) canon.href = window.location.href;

        if (window.MetaGenerator) {
          MetaGenerator.forStaticPage({
            title: guide.meta_title || guide.title + ' | دليل | Buda',
            description: guide.meta_description || guide.subtitle || '',
            image: guide.image || '',
          });
        }

        if (window.SchemaGenerator) {
          SchemaGenerator.injectBreadcrumb([
            { name: 'الرئيسية', url: '/' },
            { name: 'مركز المعرفة', url: '/pages/knowledge-center.html' },
            { name: guide.title, url: window.location.href },
          ]);
        }
      });
    })();
  </script>
  <script src="../assets/js/supabase-client.js?v=20260812"></script>
<script src="../assets/js/taager-integration.js?v=20260810"></script>
<script src="../assets/js/noon-shell.js?v=20260810"></script>
</body>
</html>
