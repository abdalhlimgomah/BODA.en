<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الأقسام - Buda</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="../assets/fonts/cairo.css" rel="stylesheet">
  <link href="../assets/fonts/material-icons-outlined.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin-content.css">
  <link rel="stylesheet" href="../assets/css/admin-categories.css">
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
</head>
<body>
  <div id="admin-categories-root">
    <div class="cm-login" id="acLogin">
      <div class="cm-login-card">
        <h2>إدارة الأقسام</h2>
        <p>يرجى تسجيل الدخول للمتابعة</p>
        <button class="cm-login-btn" id="acLoginBtn" type="button">تسجيل الدخول</button>
      </div>
    </div>

    <div class="ac-layout" id="acLayout" style="display:none">
      <aside class="cm-sidebar">
        <div class="cm-sidebar-header">
          <h2>إدارة الأقسام</h2>
          <div class="cm-version">v1.0</div>
        </div>
        <nav class="cm-nav">
          <button class="cm-nav-item active" data-tab="categories">
            <span class="material-icons-outlined">category</span>
            الأقسام
          </button>
          <button class="cm-nav-item" data-tab="branches">
            <span class="material-icons-outlined">account_tree</span>
            الفروع
          </button>
        </nav>
        <div style="padding:12px;margin-top:auto">
          <button class="cm-nav-item" id="acLogoutBtn" type="button" style="color:#ef4444">
            <span class="material-icons-outlined">logout</span>
            تسجيل خروج
          </button>
        </div>
      </aside>

      <main class="cm-main">
        <!-- Categories Tab -->
        <div class="ac-tab active" id="tab-categories">
          <div class="ac-tab-header">
            <h2>الأقسام</h2>
            <button class="ac-btn ac-btn-primary" id="acAddCategoryBtn" type="button">
              <span class="material-icons-outlined">add</span> إضافة قسم
            </button>
          </div>
          <div class="ac-table-wrap">
            <table class="ac-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>الاسم</th>
                  <th>Slug</th>
                  <th>الصورة</th>
                  <th>الكلمات المفتاحية</th>
                  <th>الترتيب</th>
                  <th>فعال</th>
                  <th>إجراءات</th>
                </tr>
              </thead>
              <tbody id="acCategoriesBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Branches Tab -->
        <div class="ac-tab" id="tab-branches">
          <div class="ac-tab-header">
            <h2>الفروع</h2>
            <button class="ac-btn ac-btn-primary" id="acAddBranchBtn" type="button">
              <span class="material-icons-outlined">add</span> إضافة فرع
            </button>
          </div>
          <div class="ac-table-wrap">
            <table class="ac-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>الفرع</th>
                  <th>القسم الأب</th>
                  <th>الصورة</th>
                  <th>الكلمات المفتاحية</th>
                  <th>الترتيب</th>
                  <th>فعال</th>
                  <th>إجراءات</th>
                </tr>
              </thead>
              <tbody id="acBranchesBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="ac-modal-overlay" id="acCategoryModal" style="display:none">
    <div class="ac-modal">
      <div class="ac-modal-header">
        <h3 id="acCategoryModalTitle">إضافة قسم</h3>
        <button class="ac-modal-close" id="acCategoryModalClose" type="button">&times;</button>
      </div>
      <div class="ac-modal-body">
        <input type="hidden" id="acEditCategoryId" />
        <label>الاسم <input type="text" id="acCategoryName" class="ac-input" /></label>
        <label>Slug <input type="text" id="acCategorySlug" class="ac-input" /></label>
        <label>الاسم بالإنجليزية <input type="text" id="acCategoryNameEn" class="ac-input" /></label>
        <label>رابط الصورة <input type="text" id="acCategoryImage" class="ac-input" /></label>
        <label>الوصف <textarea id="acCategoryDesc" class="ac-input" rows="2"></textarea></label>
        <label>الكلمات المفتاحية (كلمة واحدة في كل سطر)
          <textarea id="acCategoryKeywords" class="ac-input" rows="4" placeholder="هاتف&#10;موبايل&#10;سامسونج"></textarea>
        </label>
        <label>الأيقونة <input type="text" id="acCategoryIcon" class="ac-input" placeholder="devices" /></label>
        <label>ترتيب الفرز <input type="number" id="acCategorySort" class="ac-input" value="0" /></label>
        <label class="ac-checkbox-label">
          <input type="checkbox" id="acCategoryActive" checked /> فعال
        </label>
      </div>
      <div class="ac-modal-footer">
        <button class="ac-btn ac-btn-secondary" id="acCategoryModalCancel" type="button">إلغاء</button>
        <button class="ac-btn ac-btn-primary" id="acCategoryModalSave" type="button">حفظ</button>
      </div>
    </div>
  </div>

  <!-- Branch Modal -->
  <div class="ac-modal-overlay" id="acBranchModal" style="display:none">
    <div class="ac-modal">
      <div class="ac-modal-header">
        <h3 id="acBranchModalTitle">إضافة فرع</h3>
        <button class="ac-modal-close" id="acBranchModalClose" type="button">&times;</button>
      </div>
      <div class="ac-modal-body">
        <input type="hidden" id="acEditBranchId" />
        <label>اسم الفرع <input type="text" id="acBranchName" class="ac-input" /></label>
        <label>القسم الأب
          <select id="acBranchCategory" class="ac-input"></select>
        </label>
        <label>رابط الصورة <input type="text" id="acBranchImage" class="ac-input" /></label>
        <label>الكلمات المفتاحية (كلمة واحدة في كل سطر)
          <textarea id="acBranchKeywords" class="ac-input" rows="4" placeholder="هاتف&#10;موبايل"></textarea>
        </label>
        <label>ترتيب الفرز <input type="number" id="acBranchSort" class="ac-input" value="0" /></label>
        <label class="ac-checkbox-label">
          <input type="checkbox" id="acBranchActive" checked /> فعال
        </label>
      </div>
      <div class="ac-modal-footer">
        <button class="ac-btn ac-btn-secondary" id="acBranchModalCancel" type="button">إلغاء</button>
        <button class="ac-btn ac-btn-primary" id="acBranchModalSave" type="button">حفظ</button>
      </div>
    </div>
  </div>

  <script src="../assets/vendor/supabase/supabase-js@2.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.config.js"></script>
  <script src="../assets/js/admin-categories.js"></script>
</body>
</html>
