<body class="app-shell">
           <!-- ========== HEADER - Noon Style (2 Rows) ========== -->
        <header class="app-header buda-header"></header>

  <main class="app-main search-page-layout">
    <!-- Sidebar for Filters (Desktop only) -->
    <aside class="search-sidebar">
        <h3>الفلاتر</h3>
        <div class="filter-group">
            <h4>الفئة</h4>
            <ul id="category-filters">
                <!-- سيتم تحميل فلاتر الفئة هنا بواسطة JS -->
                <li><a href="#">إلكترونيات</a></li>
                <li><a href="#">أزياء</a></li>
                <li><a href="#">مستلزمات منزلية</a></li>
                <li><a href="#">جمال وعطور</a></li>
            </ul>
        </div>
        <div class="filter-group">
            <h4>العلامة التجارية</h4>
            <ul id="brand-filters">
                 <!-- سيتم تحميل فلاتر العلامة التجارية هنا بواسطة JS -->
                <li><a href="#">سامسونج</a></li>
                <li><a href="#">آبل</a></li>
                <li><a href="#">نايكي</a></li>
                <li><a href="#">سوني</a></li>
            </ul>
        </div>
         <div class="filter-group">
            <h4>السعر</h4>
            <input type="range" min="0" max="5000" value="5000" style="width:100%;" id="price-range-slider">
            <div class="price-range-inputs">
                <div class="price-range-field">
                    <span>من</span>
                    <input type="text" id="price-min-display" value="0" readonly>
                </div>
                <div class="price-range-field">
                    <span>إلى</span>
                    <input type="text" id="price-max-display" value="5000" readonly>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Search Content -->
    <div class="search-content-main">
      <section class="section-block search-shell" data-skeleton-container data-skeleton-type="products-grid">
        <ul id="suggestions" class="search-list hidden" aria-label="اقتراحات البحث"></ul>
        <ul id="search-history" class="search-list search-history-list" aria-label="عمليات البحث السابقة"></ul>
        
        <!-- شريط الترتيب -->
        <div id="search-sort-bar" class="hidden"></div>
        
        <!-- فلاتر الأقسام لنتائج البحث -->
        <div id="search-filter-container" class="chip-row hidden" style="margin-bottom: 16px; padding: 4px 8px; overflow-x: auto; display: flex; gap: 8px; scrollbar-width: none;"></div>
        
        <div id="search-results" class="search-results-grid" data-skeleton-container></div>

<script>
  // Script to connect price slider to display inputs
  document.addEventListener('DOMContentLoaded', function() {
    const slider = document.getElementById('price-range-slider');
    const maxDisplay = document.getElementById('price-max-display');
    if (slider && maxDisplay) {
      slider.addEventListener('input', () => maxDisplay.value = slider.value);
    }
  });
</script>
