    .sec-page-card { background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }

    .sec-page-card-img { position: relative; aspect-ratio: 1/1; overflow: hidden; background: #f8f8f8; }

    .sec-page-card-info { padding: 10px 12px 14px; }

    .sec-page-prices { display: flex; align-items: center; gap: 6px; }

    .sec-page-old { font-size: 0.65rem; color: #999; text-decoration: line-through; }
    .sec-page-rating { font-size: 0.6rem; color: #f59e0b; margin: 4px 0; }
    .sec-page-empty { text-align: center; padding: 60px 20px; color: #999; }
    .sec-page-skeleton { padding: 10px; display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
    .sec-page-sk-card { background: #fff; border-radius: 12px; overflow: hidden; }
    .sec-page-sk-img { width: 100%; aspect-ratio: 1/1; background: linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 50%,#f0f0f0 75%); background-size: 200% 100%; animation: sk-shimmer 1.5s ease-in-out infinite; }
    .sec-page-sk-line { height: 12px; margin: 10px; background: linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 50%,#f0f0f0 75%); background-size: 200% 100%; animation: sk-shimmer 1.5s ease-in-out infinite; border-radius: 4px; }
    .sec-page-sk-line-sm { width: 60%; }
    @keyframes sk-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Pagination */
    .sec-page-pagination { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 20px 10px 80px; direction: ltr; }
    .sec-page-pagination .sp-btn { min-width: 36px; height: 36px; border-radius: 8px; border: 1px solid #e8ecf0; background: #fff; color: #1a2530; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .sec-page-pagination .sp-btn:hover { border-color: #3866df; color: #3866df; background: #f0f4ff; }
    .sec-page-pagination .sp-btn.active { background: #3866df; border-color: #3866df; color: #fff; }
    .sec-page-pagination .sp-btn:disabled { opacity: 0.3; cursor: default; }
    .sec-page-pagination .sp-btn:disabled:hover { border-color: #e8ecf0; color: #1a2530; background: #fff; }
    .sec-page-pagination .sp-ellipsis { padding: 0 4px; color: #999; font-size: 0.8rem; }

    @media (min-width: 768px) { .sec-page-grid { grid-template-columns: repeat(4, 1fr); max-width: 1200px; margin: 0 auto; } .sec-page-header { max-width: 1200px; margin: 10px auto; } .sec-page-pagination { max-width: 1200px; margin: 0 auto; } }

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var type = params.get("type") || "";
      var title = params.get("title") || "قسم";
      var sortKey = params.get("sort") || "";
      var discountFilter = parseInt(params.get("discountFilter")) || 0;

      document.getElementById("sec-page-title").textContent = decodeURIComponent(title);

      var PRODUCTS_PER_PAGE = 42;
      var currentPage = 1;
      var allProducts = [];
      var sourceProducts = [];
      var allFiltered = [];

      async function loadProducts() {
        if (window.getHomeSourceProducts) {
          try { sourceProducts = await window.getHomeSourceProducts(); } catch (e) { sourceProducts = []; }
        }
        if (!sourceProducts.length && window.BudaStore) {
          var db = window.BudaStore.getAllProducts();
          sourceProducts = Object.values(db).filter(Boolean);
        }
        allProducts = sourceProducts;
        allFiltered = getFilteredProducts();
        renderPage();
      }

      function getPrice(p) { var r = window.BudaStore ? window.BudaStore.resolveProductPrice(p) : { currentPrice: Number(p.price)||0, originalPrice: Number(p.originalPrice)||0, hasDiscount: false, discountPercent: 0 }; return { finalPrice: r.currentPrice || r.finalPrice || Number(p.price)||0, originalPrice: r.originalPrice || 0, hasDiscount: r.hasDiscount || false, discountPercent: r.discountPercent || 0 }; }
      function getRating(p) { return window.BudaStore ? window.BudaStore.resolveProductRating(p) : { rating: 0, reviews: 0 }; }
      function getImage(p) { return window.BudaStore ? window.BudaStore.getImagePath((window.BudaStore.getProductImages(p)||["assets/images/unnamed.png"])[0]) : (p.image || "assets/images/unnamed.png"); }
      function formatMoney(v) { return window.BudaStore ? window.BudaStore.formatMoney(v) : (Number(v)||0).toFixed(2); }
      function escapeHtml(v) { return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }
      function shuffle(arr) { var a = [].concat(arr); for (var i = a.length-1; i > 0; i--) { var j = Math.floor(Math.random()*(i+1)); var tmp = a[i]; a[i] = a[j]; a[j] = tmp; } return a; }

      function getFilteredProducts() {
        var pool = [].concat(allProducts);
        if (type === "shein-trend" || type === "shein-new") {
          pool = shuffle(pool);
        } else if (type === "shein-deal") {
          var minDisc = discountFilter || 30;
          pool = pool.filter(function (p) { var r = getPrice(p); return r.hasDiscount && r.discountPercent >= minDisc; });
          if (!pool.length) pool = [].concat(allProducts);
          pool.sort(function (a, b) { return getPrice(b).discountPercent - getPrice(a).discountPercent; });
        } else if (type === "shein-style") {
          pool = shuffle(pool);
        } else if (type === "taager-extra") {
          if (sortKey === "discount") pool.sort(function (a, b) { return getPrice(b).discountPercent - getPrice(a).discountPercent; });
          else if (sortKey === "rating") pool.sort(function (a, b) { return getRating(b).rating - getRating(a).rating; });
          else if (sortKey === "price") pool.sort(function (a, b) { return (Number(a.price)||0) - (Number(b.price)||0); });
          else pool = shuffle(pool);
        }
        return pool;
      }

      function renderPage() {
        var grid = document.getElementById("sec-page-grid");
        var skeleton = document.getElementById("sec-page-skeleton");
        var paginationEl = document.getElementById("sec-page-pagination");
        skeleton.style.display = "none";

        if (!allFiltered.length) {
          grid.style.display = "block";
          grid.innerHTML = '<div class="sec-page-empty">لا توجد منتجات في هذا القسم</div>';
          paginationEl.style.display = "none";
          return;
        }

        var totalPages = Math.ceil(allFiltered.length / PRODUCTS_PER_PAGE);
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        var start = (currentPage - 1) * PRODUCTS_PER_PAGE;
        var pageItems = allFiltered.slice(start, start + PRODUCTS_PER_PAGE);

        var html = "";
        pageItems.forEach(function (p) {
          var rp = getPrice(p); var rr = getRating(p);
          var img = getImage(p); var id = String(p.id);
          html += '<div class="sec-page-card" data-view-product="' + id + '">' +
            '<div class="sec-page-card-img"><img src="' + img + '" alt="' + escapeHtml(p.name||"") + '" loading="lazy" onerror="this.style.display=\'none\'" />' +
            (rp.hasDiscount ? '<span class="sec-page-discount">-' + rp.discountPercent + '%</span>' : '') + '</div>' +
            '<div class="sec-page-card-info"><h4>' + escapeHtml((p.name||"").slice(0,40)) + '</h4>' +
            (rr.reviews > 0 ? '<div class="sec-page-rating">★ ' + rr.rating.toFixed(1) + ' (' + rr.reviews + ')</div>' : '') +
            '<div class="sec-page-prices"><span class="sec-page-current">' + formatMoney(rp.finalPrice) + '</span>' +
            (rp.hasDiscount ? '<span class="sec-page-old">' + formatMoney(rp.originalPrice) + '</span>' : '') + '</div></div></div>';
        });
        grid.innerHTML = html;
        grid.style.display = "grid";

        // click events
        grid.querySelectorAll("[data-view-product]").forEach(function (el) {
          el.addEventListener("click", function () {
            var pid = el.getAttribute("data-view-product");
            if (pid) { var prod = window.BudaStore?.getProductById(pid); if (prod) { try { sessionStorage.setItem("selectedProduct", encodeURIComponent(JSON.stringify(prod))); } catch {} } window.location.href = "product.html?id=" + encodeURIComponent(pid); }
          });
        });

        renderPagination(totalPages);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderPagination(totalPages) {
        var paginationEl = document.getElementById("sec-page-pagination");
        if (totalPages <= 1) { paginationEl.style.display = "none"; return; }
        paginationEl.style.display = "flex";

        var parts = [];

        // First
        parts.push('<button class="sp-btn" data-page="1"' + (currentPage === 1 ? ' disabled' : '') + '>«</button>');
        // Prev
        parts.push('<button class="sp-btn" data-page="' + (currentPage - 1) + '"' + (currentPage === 1 ? ' disabled' : '') + '>‹</button>');

        // Page numbers
        var rangeStart = Math.max(1, currentPage - 2);
        var rangeEnd = Math.min(totalPages, currentPage + 2);

        if (rangeStart > 1) {
          parts.push('<button class="sp-btn" data-page="1">1</button>');
          if (rangeStart > 2) parts.push('<span class="sp-ellipsis">...</span>');
        }
        for (var p = rangeStart; p <= rangeEnd; p++) {
          parts.push('<button class="sp-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>');
        }
        if (rangeEnd < totalPages) {
          if (rangeEnd < totalPages - 1) parts.push('<span class="sp-ellipsis">...</span>');
          parts.push('<button class="sp-btn" data-page="' + totalPages + '">' + totalPages + '</button>');
        }

        // Next
        parts.push('<button class="sp-btn" data-page="' + (currentPage + 1) + '"' + (currentPage === totalPages ? ' disabled' : '') + '>›</button>');
        // Last
        parts.push('<button class="sp-btn" data-page="' + totalPages + '"' + (currentPage === totalPages ? ' disabled' : '') + '>»</button>');

        paginationEl.innerHTML = parts.join("");

        paginationEl.querySelectorAll(".sp-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (btn.disabled) return;
            currentPage = parseInt(btn.getAttribute("data-page"), 10);
            renderPage();
          });
        });
      }

      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", loadProducts);
      else loadProducts();
    })();
  </script>
