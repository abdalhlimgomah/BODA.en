<body class="app-shell">


  <main class="app-main edit-account-page">

    <h1 class="page-title" data-i18n="استعرض و حدث بيانات التواصل و معلومات حسابك">استعرض و حدث بيانات التواصل و معلومات حسابك</h1>
    <p class="page-subtitle" data-i18n="قم بتحديث معلوماتك الشخصية وبيانات الاتصال">قم بتحديث معلوماتك الشخصية وبيانات الاتصال</p>

    <div class="edit-section">
      <h2 class="edit-section-title" data-i18n="معلومات الاتصال">معلومات الاتصال</h2>

      <div class="edit-field">
        <label data-i18n="البريد الإلكتروني">البريد الإلكتروني</label>
        <input id="editEmail" class="noon-input" type="email" readonly />
      </div>

      <div class="edit-field">
        <label data-i18n="رقم الجوّال">رقم الجوّال</label>
        <div id="editPhoneWrap">
          <div class="readonly-phone-card">
            <div class="phone-text-wrap">
              <span class="phone-text" id="phoneDisplayVal">لم يتم تعيين رقم هاتف</span>
              <span class="phone-badge unverified" id="phoneStatusBadge">
                <span class="material-icons-outlined"></span>
                <span id="phoneStatusBadgeText">غير متحقق</span>
              </span>
            </div>
            <button type="button" class="phone-edit-trigger" id="editPhoneTriggerBtn">تعديل</button>
          </div>
          <!-- Hidden input to keep compatibility with existing submit logic -->
          <input id="editPhone" type="hidden" />
        </div>
        <p class="field-note" data-i18n="استخدمه لتسجيل الدخول على جميع تطبيقات نون.">استخدمه لتسجيل الدخول على جميع تطبيقات BudoQ.</p>
      </div>
    </div>

    <div class="edit-section">
      <h2 class="edit-section-title" data-i18n="معلوماتك الشخصية">معلوماتك الشخصية</h2>

      <div class="edit-field">
        <label data-i18n="الاسم الأول">الاسم الأول</label>
        <input id="editFirstName" class="noon-input" type="text" placeholder="الاسم الأول" />
      </div>

      <div class="edit-field">
        <label data-i18n="اسم العائلة">اسم العائلة</label>
        <input id="editLastName" class="noon-input" type="text" placeholder="اسم العائلة" />
      </div>

      <div class="edit-field">
        <label data-i18n="يوم الميلاد">يوم الميلاد</label>
        <div class="birthday-selects">
          <select id="editBirthDay">
            <option value="">اليوم</option>
          </select>
          <select id="editBirthMonth">
            <option value="">الشهر</option>
          </select>
          <select id="editBirthYear">
            <option value="">السنة</option>
          </select>
        </div>
        <p class="birthday-display" id="birthdayDisplay"></p>
      </div>

      <div class="edit-field">
        <label data-i18n="الجنس">الجنس</label>
        <div class="gender-options">
          <label class="gender-option" id="genderMale">
            <input type="radio" name="gender" value="male" />
            <span data-i18n="ذكر">ذكر</span>
          </label>
          <label class="gender-option" id="genderFemale">
            <input type="radio" name="gender" value="female" />
            <span data-i18n="أنثى">أنثى</span>
          </label>
        </div>
      </div>

      <div class="edit-field">
        <label data-i18n="الجنسية">الجنسية</label>
        <select id="editNationality" class="nationality-select">
          <option value="مصر">مصر</option>
          <option value="السعودية">السعودية</option>
        </select>
      </div>
    </div>

    <button id="editSubmitBtn" class="edit-submit-btn" type="button" data-i18n="تحديث حسابك">تحديث حسابك</button>
  </main>
