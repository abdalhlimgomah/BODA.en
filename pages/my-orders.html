<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الطلبات - BudoQ</title>
  <link href="../assets/fonts/cairo.css" rel="stylesheet" />
  <link href="../assets/fonts/material-icons-outlined.css" rel="stylesheet" />
  <link href="../assets/css/noon-theme.css" rel="stylesheet" />
  <link href="../assets/css/noon-shell.css" rel="stylesheet" />
  <link href="../assets/css/noon-components.css" rel="stylesheet" />
  <link href="../assets/css/my-orders.css?v=20260723-1" rel="stylesheet" />
  <link href="../assets/css/desktop.css?v=20260630" rel="stylesheet" />
<link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../assets/icons/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/icons/favicon-64x64.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="manifest" href="../assets/icons/site.webmanifest">
<meta name="theme-color" content="#FFD500" />        
  <meta property="og:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <meta name="twitter:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
</head>
<body class="app-shell my-orders-noon-shell">

  <main class="my-orders-noon-main">
    <p id="orders-status" class="status-note hidden" aria-live="polite"></p>

    <section class="orders-top-controls" aria-label="التحكم في الطلبات">
      <div class="orders-control-grid">
        <label class="orders-control orders-control-search" for="orders-search-input">
          <span class="material-icons-outlined">search</span>
          <input
            id="orders-search-input"
            type="search"
            placeholder="ابحث عن رقم الطلب أو اسم المنتج"
            autocomplete="off"
          />
        </label>
        <label class="orders-control orders-control-period" for="orders-period-select">
          <span class="material-icons-outlined">expand_more</span>
          <select id="orders-period-select" aria-label="فلتر الفترة الزمنية">
            <option value="3m" selected>آخر 3 أشهر</option>
            <option value="6m">آخر 6 أشهر</option>
            <option value="12m">آخر 12 شهر</option>
            <option value="all">الكل</option>
          </select>
        </label>
      </div>
    </section>

    <section class="orders-status-tabs" aria-label="فلتر حالة الطلب">
      <button class="orders-tab active" data-status-tab="all">الكل</button>
      <button class="orders-tab" data-status-tab="pending">قيد المراجعة</button>
      <button class="orders-tab" data-status-tab="shipped">تم الشحن</button>
      <button class="orders-tab" data-status-tab="on-way">في الطريق</button>
      <button class="orders-tab" data-status-tab="delivered">تم التوصيل</button>
      <button class="orders-tab" data-status-tab="returns">المرتجعات</button>
    </section>

    <section id="orders-list" class="orders-list" aria-live="polite"></section>
  </main>

  

  <script src="../assets/vendor/supabase/supabase-js@2.js"></script>
  <script src="../assets/js/supabase-client.js?v=20260327-1"></script>
  <script src="../assets/js/store.js?v=20260630d"></script>
  <script src="../assets/js/noon-shell.js"></script>
  <script src="../assets/js/orders-common.js?v=20260723-2"></script>
  <script src="../assets/js/my-orders.js?v=20260723-2"></script>
</body>
</html>
