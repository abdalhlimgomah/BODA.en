<body>

      <h1 class="auth-title" data-i18n="تسجيل الخروج؟">تسجيل الخروج؟</h1>

      <div class="inline-actions" style="justify-content: center;">
        <button class="btn-danger" type="button" onclick="confirmLogout()" data-i18n="نعم، تسجيل خروج">نعم، تسجيل خروج</button>
        <button class="btn-primary" type="button" onclick="goBack()" data-i18n="إلغاء">إلغاء</button>
