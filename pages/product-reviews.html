  <main class="app-main product-review-page">
    <p id="reviews-status" class="status-note hidden" aria-live="polite"></p>



    <section class="section-block review-target-card-wrap">
      <article id="review-target-card" class="review-target-card"></article>
    </section>

    <section id="review-compose-section" class="section-block review-compose-section hidden">
      <div class="section-head">
        <h2 data-i18n="أضف تقييمك">أضف تقييمك</h2>
        <span class="pill" data-i18n="بعد الشراء">بعد الشراء</span>
      </div>
      <p id="review-compose-note" class="review-compose-note"></p>

      <form id="review-form" class="review-form" novalidate>
        <div id="review-stars-select" class="review-stars-select" role="radiogroup" aria-label="اختر تقييم المنتج">
          <button type="button" class="review-star-btn" data-star-value="1" aria-label="نجمة واحدة">
            <span class="material-icons-outlined"></span>
          </button>
          <button type="button" class="review-star-btn" data-star-value="2" aria-label="نجمتان">
            <span class="material-icons-outlined"></span>
          </button>
          <button type="button" class="review-star-btn" data-star-value="3" aria-label="3 نجوم">
            <span class="material-icons-outlined"></span>
          </button>
          <button type="button" class="review-star-btn" data-star-value="4" aria-label="4 نجوم">
            <span class="material-icons-outlined"></span>
          </button>
          <button type="button" class="review-star-btn" data-star-value="5" aria-label="5 نجوم">
            <span class="material-icons-outlined"></span>
          </button>
        </div>
        <p id="review-rating-hint" class="review-rating-hint" data-i18n="اختر عدد النجوم">اختر عدد النجوم</p>

        <div id="review-images-section" class="review-images-section">
          <label id="review-image-upload" class="review-image-upload" for="review-image-input" role="button" tabindex="0" aria-label="إضافة صور للتقييم">
            <input id="review-image-input" class="review-image-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
            <span class="material-icons-outlined review-image-upload-icon"></span>
            <span class="review-image-upload-text">أضف صوراً (اختياري)</span>
            <small class="review-image-upload-hint">أقصى 3 صور • JPG/PNG/WebP</small>
          </label>
          <div id="review-image-previews" class="review-image-previews"></div>
          <small id="review-image-error" class="review-image-error hidden"></small>
        </div>

        <label class="noon-field">
          <span data-i18n="عنوان التقييم">عنوان التقييم</span>
          <input id="review-title" class="noon-input" type="text" maxlength="100" placeholder="أضف عنوان" />
          <small class="review-counter"><span id="review-title-count">0</span>/100</small>
        </label>

        <label class="noon-field">
          <span data-i18n="تفاصيل التقييم">تفاصيل التقييم</span>
          <textarea
            id="review-body"
            class="noon-textarea"
            rows="4"
            maxlength="1000"
            placeholder="اكتب تجربتك مع المنتج..."
          ></textarea>
          <small class="review-counter"><span id="review-body-count">0</span>/1000</small>
        </label>

        <label class="review-anonymous-toggle" for="review-anonymous">
          <span class="review-switch-wrap">
            <input id="review-anonymous" type="checkbox" />
            <span class="review-switch-ui" aria-hidden="true"></span>
          </span>
          <span class="review-anonymous-label" data-i18n="مجهول">مجهول</span>
        </label>
        <p id="review-publish-note" class="review-publish-note"></p>

        <button id="review-submit-btn" class="btn-primary review-submit-btn" type="submit" disabled>
          <span data-i18n="إرسال التقييم">إرسال التقييم</span>
        </button>
      </form>
    </section>

    <section class="section-block comments-section">
      <div class="section-head">
        <h2 data-i18n="التقييمات والتعليقات">التقييمات والتعليقات</h2>
        <span id="comments-count" class="pill">0 تعليق</span>
      </div>

      <div class="comments-summary">
        <strong id="comments-average">0.0</strong>
        <span data-i18n="متوسط التقييم">متوسط التقييم</span>
      </div>

      <div id="comments-list" class="comments-list"></div>
    </section>
