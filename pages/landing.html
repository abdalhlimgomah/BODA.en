<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>صفحة هبوط - BudoQ</title>
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="">
  <meta property="og:locale" content="ar_AR">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <meta name="twitter:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="../assets/css/blog.css">
  <link rel="stylesheet" href="../assets/css/noon.css?v=20260815">
  <script src="../assets/js/seo/seo-utils.js"></script>
</head>
<body>
  <header class="app-header"></header>
  <div id="shell-root"></div>

  <div class="blog-page" id="landing-page">
    <div id="landing-banner-container"></div>
    <div id="landing-content" class="post-content"></div>
    <div id="landing-products-featured"></div>
    <div id="landing-faq"></div>
  </div>

  <div id="shell-footer"></div>

  <script src="../assets/js/seo/blog-engine.js"></script>
  <script src="../assets/js/seo/knowledge-center.js"></script>
  <script src="../assets/js/seo/content-engine.js"></script>
  <script src="../assets/js/seo/meta-generator.js"></script>
  <script src="../assets/js/seo/schema-generator.js"></script>
  <script src="../assets/js/seo/seo-engine.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) {
        document.getElementById('landing-page').innerHTML = '<div class="blog-empty"><span class="material-icons-outlined" style="font-size:64px">error_outline</span><p>صفحة الهبوط غير موجودة</p></div>';
        return;
      }

      KnowledgeCenter.getLandingPage(slug).then(function (page) {
        if (!page) {
          document.getElementById('landing-page').innerHTML = '<div class="blog-empty"><span class="material-icons-outlined" style="font-size:64px">error_outline</span><p>صفحة الهبوط غير موجودة</p></div>';
          return;
        }

        KnowledgeCenter.renderLandingBanner(page, 'landing-banner-container');

        var contentEl = document.getElementById('landing-content');
        if (contentEl) contentEl.innerHTML = page.content_html || page.description || '';

        KnowledgeCenter.renderLandingFAQ(page, 'landing-faq');

        document.title = (page.meta_title || page.title) + ' | Buda';
        var canon = document.querySelector('link[rel="canonical"]');
        if (canon) canon.href = window.location.href;

        if (page.is_noindex) {
          var robots = document.querySelector('meta[name="robots"]');
          if (robots) robots.setAttribute('content', 'noindex, nofollow');
        }

        if (window.MetaGenerator) {
          MetaGenerator.forStaticPage({
            title: page.meta_title || page.title + ' | Buda',
            description: page.meta_description || page.subtitle || page.description || '',
            noindex: page.is_noindex || false,
          });
        }

        if (window.SchemaGenerator) {
          SchemaGenerator.injectBreadcrumb([
            { name: 'الرئيسية', url: '/' },
            { name: page.title, url: window.location.href },
          ]);
        }
      });
    })();
  </script>
  <script src="../assets/js/supabase-client.js?v=20260812"></script>
<script src="../assets/js/taager-integration.js?v=20260810"></script>
<script src="../assets/js/noon-shell.js?v=20260817"></script>
</body>
</html>
