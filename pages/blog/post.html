<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>

  <meta name="google-site-verification" content="q1MFwOEAkO9NfCPAxkndikzVKwlsOjKWBSmPafSFQXw" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مقال - مدونة Buda</title>
  <meta name="description" content="اقرأ مقالات ومدونة BudoQ - محتوى تعليمي ومفيد حول أفضل المنتجات ونصائح الشراء وأحدث العروض والخصومات." />
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://budoq.com/pages/blog/post.html">
  <meta property="og:locale" content="ar_AR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="../../assets/icons/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="../../assets/css/blog.css">
  <link rel="stylesheet" href="../../assets/css/noon.css?v=20260815">
  <script src="../../assets/js/seo/seo-utils.js"></script>
<script defer src="https://cdn.vercel-insights.com/beacon.js"></script>
</head>
<body>
  <div id="reading-progress-bar" class="reading-progress-bar"></div>
  <div id="shell-root"></div>

  <article class="blog-post" id="blog-post">
    <div class="blog-loading" id="post-loading">
      <div class="skeleton-loader" style="height:40px;width:60%;margin:0 auto 12px;border-radius:8px"></div>
      <div class="skeleton-loader" style="height:20px;width:40%;margin:0 auto 24px;border-radius:8px"></div>
      <div class="skeleton-loader" style="height:400px;border-radius:16px;margin-bottom:24px"></div>
      <div class="skeleton-loader" style="height:20px;border-radius:4px;margin-bottom:8px"></div>
      <div class="skeleton-loader" style="height:20px;border-radius:4px;margin-bottom:8px;width:80%"></div>
    </div>
  </article>

  <div id="post-related" style="max-width:800px;margin:0 auto;padding:0 20px 40px"></div>
  <div id="shell-footer"></div>

  <script src="../../assets/js/seo/blog-engine.js"></script>
  <script src="../../assets/js/seo/content-engine.js"></script>
  <script src="../../assets/js/seo/meta-generator.js"></script>
  <script src="../../assets/js/seo/schema-generator.js"></script>
  <script src="../../assets/js/seo/seo-engine.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) {
        document.getElementById('blog-post').innerHTML = '<div class="blog-empty"><span class="material-icons-outlined" style="font-size:64px">error_outline</span><p>المقال غير موجود</p></div>';
        return;
      }

      BlogEngine.getPostBySlug(slug).then(function (post) {
        if (!post) {
          document.getElementById('blog-post').innerHTML = '<div class="blog-empty"><span class="material-icons-outlined" style="font-size:64px">error_outline</span><p>المقال غير موجود</p></div>';
          document.title = 'المقال غير موجود - Buda';
          return;
        }

        document.getElementById('post-loading').style.display = 'none';

        var cat = post.blog_categories || {};
        var author = post.blog_authors || {};
        var dateStr = post.published_at || post.created_at || '';
        var readTime = post.reading_time || Math.max(1, Math.ceil((post.content || '').length / 1000));

        var html = '<header class="post-header">
  <meta name="google-site-verification" content="q1MFwOEAkO9NfCPAxkndikzVKwlsOjKWBSmPafSFQXw" />';
        if (cat.name) html += '<span class="post-category" style="background:' + (cat.color || '#1a2530') + '20;color:' + (cat.color || '#1a2530') + '">' + cat.name + '</span>';
        html += '<h1>' + BlogEngine.escHtml(post.title) + '</h1>';
        html += '<div class="post-meta">';
        if (author.name) html += '<span><span class="material-icons-outlined" style="font-size:16px">person</span> ' + BlogEngine.escHtml(author.name) + '</span>';
        if (dateStr) html += '<span><span class="material-icons-outlined" style="font-size:16px">calendar_today</span> ' + BlogEngine.formatDate(dateStr) + '</span>';
        html += '<span><span class="material-icons-outlined" style="font-size:16px">schedule</span> ' + readTime + ' دقائق قراءة</span>';
        html += '</div></header>';

        if (post.featured_image) html += '<img src="' + post.featured_image + '" alt="' + BlogEngine.escHtml(post.title) + '" class="post-featured-image" loading="lazy">';

        html += '<div class="post-content" id="post-content"></div>';

        html += '<div id="post-faq"></div>';
        html += '<div id="post-related-products"></div>';
        html += '<div id="post-share"></div>';

        document.getElementById('blog-post').innerHTML = html;

        BlogEngine.renderPostContent(post, 'post-content');
        BlogEngine.renderTOC(post, 'post-content');
        BlogEngine.renderFAQ(post, 'post-faq');
        BlogEngine.renderRelatedProducts(post, 'post-related-products');
        BlogEngine.renderShareButtons(post, 'post-share');
        BlogEngine.renderReadingProgress();

        var contentEl = document.getElementById('post-content');
        if (contentEl) BlogEngine.addHeadingIDs(contentEl);

        document.title = (post.meta_title || post.title) + ' | مدونة Buda';
        var canon = document.querySelector('link[rel="canonical"]');
        if (canon) canon.href = window.location.href;

        if (window.SEOEngine && window.MetaGenerator) {
          MetaGenerator.forArticlePage({
            title: post.meta_title || post.title,
            description: post.meta_description || post.excerpt,
            image: post.featured_image,
            url: window.location.href,
          });
        }

        if (window.SchemaGenerator) {
          SchemaGenerator.injectArticle(post);
          SchemaGenerator.injectBreadcrumb([
            { name: 'الرئيسية', url: '/' },
            { name: 'المدونة', url: '/pages/blog/' },
            { name: post.title, url: window.location.href },
          ]);
        }

        BlogEngine.getRelatedPosts(post.id || post.slug, 4).then(function (related) {
          if (related && related.length) {
            var relContainer = document.getElementById('post-related');
            if (relContainer) {
              var relHtml = '<div class="related-posts-section" style="max-width:800px;margin:40px auto;padding:0 20px"><h3 class="section-title">مقالات ذات صلة</h3><div class="blog-grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">';
              related.forEach(function (rp) {
                relHtml += BlogEngine.renderPostCard(rp);
              });
              relHtml += '</div></div>';
              relContainer.innerHTML = relHtml;
            }
          }
        });
      });
    })();
  </script>
  <script src="../../assets/js/supabase-client.js?v=20260822c"></script>
</body>
</html>
