  <meta property="og:title" content="المدونة - Buda | مقالات ونصائح وأدلة شراء">
  <meta property="og:description" content="مدونة Buda: مقالات في التسوق، أدلة شراء، مقارنات، مراجعات، ونصائح. اكتشف أفضل المنتجات والعروض الحصرية.">
  <meta property="og:url" content="https://buda-rho.vercel.app/pages/blog/">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="المدونة - Buda | مقالات ونصائح وأدلة شراء">
  <meta name="twitter:description" content="مدونة Buda: مقالات في التسوق، أدلة شراء، مقارنات، مراجعات، ونصائح.">
  <link rel="icon" type="image/png" href="../../assets/icons/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

  <link rel="stylesheet" href="../../assets/css/noon.css">

</head>
<body>
  <div id="shell-root"></div>
  <div class="blog-page">
    <header class="blog-header">
      <h1>مدونة Buda</h1>
      <p>مقالات، أدلة شراء، مقارنات، ونصائح لتجربة تسوق أفضل</p>
    </header>

    <div class="blog-search">
      <input type="text" class="blog-search-input" id="blog-search-input" placeholder="ابحث في المقالات..." oninput="BlogEngine.searchPosts(this.value).then(function(p){BlogEngine.renderPosts(p,'blog-grid')})">
    </div>

    <nav class="blog-tabs" id="blog-categories"></nav>

    <div class="blog-grid" id="blog-grid">
      <div class="blog-loading">
        <div class="skeleton-loader" style="height:200px;border-radius:16px;margin-bottom:16px"></div>
        <div class="skeleton-loader" style="height:100px;border-radius:8px"></div>
      </div>
    </div>
  </div>

  <div id="shell-footer"></div>
  <script src="../../assets/js/seo/blog-engine.js"></script>
  <script src="../../assets/js/seo/content-engine.js"></script>
  <script>
    (function () {
      function loadBlog() {
        BlogEngine.getCategories().then(function (cats) {
          var container = document.getElementById('blog-categories');
          if (!container) return;
          var html = '<a href="." class="blog-tab active">الكل</a>';
          cats.forEach(function (c) {
            html += '<a href="?category=' + encodeURIComponent(c.slug) + '" class="blog-tab">' + BlogEngine.escHtml(c.name) + '</a>';
          });
          container.innerHTML = html;
        });

        var params = new URLSearchParams(window.location.search);
        var category = params.get('category') || '';

        BlogEngine.fetchPosts({ category: category, limit: 24 }).then(function (posts) {
          BlogEngine.renderPosts(posts, 'blog-grid');
          if (posts.length) {
            document.title = (category ? 'تصنيف: ' + category + ' | ' : '') + 'المدونة - Buda';
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadBlog);
      } else {
        loadBlog();
      }
    })();
  </script>
  <script src="../../assets/js/noon-shell.js"></script>
  <script src="../../assets/js/supabase-client.js"></script>
</body>
</html>
