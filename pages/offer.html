<script defer src="https://cdn.vercel-insights.com/beacon.js"></script>
</head>
<body>
  <header class="app-header">
  <meta name="google-site-verification" content="q1MFwOEAkO9NfCPAxkndikzVKwlsOjKWBSmPafSFQXw" /></header>
  <div id="shell-root"></div>

  <div class="blog-page" id="offer-page">
    <div class="blog-loading" id="offer-loading">
      <div class="skeleton-loader" style="height:200px;border-radius:20px;margin-bottom:24px"></div>
    </div>
  </div>

  <div id="shell-footer"></div>

  <script src="../assets/js/seo/blog-engine.js"></script>
  <script src="../assets/js/seo/product-seo-engine.js"></script>
  <script src="../assets/js/seo/meta-generator.js"></script>
  <script src="../assets/js/seo/schema-generator.js"></script>
  <script src="../assets/js/seo/seo-engine.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) {
        document.getElementById('offer-page').innerHTML = '<div class="blog-empty"><span class="material-icons-outlined" style="font-size:64px">local_offer</span><p>العرض غير موجود</p></div>';
        return;
      }

      ProductSEO.getOfferBySlug(slug).then(function (offer) {
        if (!offer) {
          document.getElementById('offer-page').innerHTML = '<div class="blog-empty"><span class="material-icons-outlined" style="font-size:64px">local_offer</span><p>العرض غير موجود</p></div>';
          return;
        }

        document.getElementById('offer-loading').style.display = 'none';
        var container = document.getElementById('offer-page');

        ProductSEO.renderOfferBanner(offer, 'offer-page');
        ProductSEO.applyOfferSEO(offer);

        var html = '<div class="post-content" style="margin-top:32px">';
        if (offer.content_html) html += offer.content_html;
        else if (offer.description) html += '<p>' + offer.description + '</p>';
        html += '</div>';
        html += '<div id="offer-faq"></div>';
        container.innerHTML += html;

        if (offer.faq_data && offer.faq_data.length) {
          var faqContainer = document.getElementById('offer-faq');
          if (faqContainer) {
            faqContainer.innerHTML = '<div class="faq-section" style="margin-top:32px"><h2 class="faq-title">الأسئلة الشائعة عن العرض</h2><div class="faq-list">' +
              offer.faq_data.map(function (item, i) {
                return '<div class="faq-item"><button class="faq-question" onclick="this.parentElement.classList.toggle(\'faq-open\')">' +
                  '<span>' + BlogEngine.escHtml(item.question) + '</span>' +
                  '<span class="material-icons-outlined faq-icon">expand_more</span></button>' +
                  '<div class="faq-answer">' + BlogEngine.escHtml(item.answer) + '</div></div>';
              }).join("") + '</div></div>';
          }
        }

        document.title = (offer.seo_title || offer.title) + ' | عروض Buda';
        var canon = document.querySelector('link[rel="canonical"]');
        if (canon) canon.href = window.location.href;
      });
    })();
  </script>
  <script src="../assets/js/supabase-client.js?v=20260822c"></script>
<script src="../assets/js/taager-integration.js?v=20260810"></script>
<script src="../assets/js/noon-shell.js?v=20260817"></script>
</body>
</html>
