<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>تم الطلب - BudoQ</title>
  <link href="../assets/fonts/cairo.css" rel="stylesheet" />
  <link href="../assets/fonts/material-icons-outlined.css" rel="stylesheet" />
  <link href="../assets/css/noon-theme.css" rel="stylesheet" />
  <link href="../assets/css/noon-shell.css?v=20260815" rel="stylesheet" />
  <link href="../assets/css/desktop.css?v=20260808" rel="stylesheet" />
  <link href="../assets/css/order-success.css" rel="stylesheet" />
<link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../assets/icons/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/icons/favicon-64x64.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="manifest" href="../assets/icons/site.webmanifest">
<meta name="theme-color" content="#FFD500">
  <meta property="og:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <meta name="twitter:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
</head>
<body class="app-shell app-shell--success">
  <main class="os-main">
    <div class="os-card" id="os-card">
      <div class="os-card-header">
        <div class="os-header-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M23 7L11 19L5 13" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1 class="os-header-title">قدمت طلبك</h1>
        <p class="os-header-sub">تم استلام طلبك بنجاح، سنقوم بتجهيزه وشحنه في أقرب وقت</p>
      </div>
      <div class="os-card-body">
        <div class="os-products" id="os-products"></div>
        <div class="os-delivery-summary" id="os-delivery-summary">
          <div class="os-delivery-row">
            <span class="os-delivery-label">توصلك الطلبية في</span>
            <strong class="os-delivery-value" id="os-delivery-date">5 أيام</strong>
          </div>
        </div>
      </div>
    </div>

    <div class="os-info-card">
      <div class="os-info-row">
        <span class="os-info-label">الاسم</span>
        <span class="os-info-value" id="os-name">---</span>
      </div>
      <div class="os-info-divider"></div>
      <div class="os-info-row">
        <span class="os-info-label">رقم الجوال</span>
        <span class="os-info-value" id="os-phone">---</span>
      </div>
    </div>

    <div class="os-info-card">
      <div class="os-info-row">
        <span class="os-info-label">التوصيل ل</span>
        <span class="os-info-badge">Home</span>
      </div>
      <div class="os-info-divider"></div>
      <div class="os-info-row os-address-row">
        <span class="os-info-value" id="os-address">---</span>
      </div>
    </div>

    <div class="os-actions">
      <a href="my-orders.html" class="os-btn os-btn-primary">تتبع طلباتي</a>
      <a href="home.html" class="os-btn os-btn-secondary">تسوق مرة أخرى</a>
    </div>
  </main>

  <script src="../assets/js/taager-integration.js?v=20260810"></script>
  <script src="../assets/js/noon-shell.js?v=20260810"></script>
  <script src="../assets/js/store.js?v=20260812"></script>
  <script src="../assets/js/order-success.js?v=20260815"></script>
  <script src="../assets/js/seo/analytics-manager.js"></script>
</body>
</html>
