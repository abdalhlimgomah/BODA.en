<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حذف الحساب - Buda</title>
  <link href="../assets/fonts/cairo.css" rel="stylesheet" />
  <link href="../assets/fonts/inter.css" rel="stylesheet" />
  <link href="../assets/fonts/material-icons-outlined.css" rel="stylesheet" />
  <link href="../assets/css/noon-theme.css" rel="stylesheet" />
  <link href="../assets/css/noon-components.css" rel="stylesheet" />
<link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../assets/icons/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/icons/favicon-64x64.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="manifest" href="../assets/icons/site.webmanifest">
<meta name="theme-color" content="#FFD500">
  <meta property="og:image" content="https://buda-rho.vercel.app/assets/icons/og-image.png" />
  <meta name="twitter:image" content="https://buda-rho.vercel.app/assets/icons/og-image.png" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card" style="text-align: center;">
      <div style="width: 76px; height: 76px; margin: 0 auto 10px; border-radius: 50%; background: #fee4e2; display: grid; place-items: center;">
        <span class="material-icons-outlined" style="color: #dc2626; font-size: 36px;"></span>
      </div>
      <h1 class="auth-title">حذف الحساب</h1>
      <p class="auth-subtitle" id="delete-account-name" style="font-weight: 700; font-size: 1.1rem; margin-bottom: 8px;"></p>
      <p class="auth-subtitle" style="color: #6b7280; font-size: 0.9rem;">هل أنت متأكد من حذف حسابك نهائياً؟ لا يمكن التراجع عن هذا الإجراء.</p>
      <div id="delete-account-status" class="status-note hidden" style="margin: 12px 0;"></div>
      <p id="delete-support-link" style="display:none;margin:12px 0 0;font-size:0.85rem;">
        <a href="complaints.html" style="color:#4f46e5;">تواصل مع خدمة العملاء</a>
      </p>
      <div id="delete-actions" class="inline-actions" style="justify-content: center;">
        <button id="confirm-delete-btn" class="btn-danger" type="button">نعم، حذف الحساب</button>
        <button id="cancel-delete-btn" class="btn-primary" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirm-modal" class="modal-backdrop">
    <div class="modal-card" style="max-width: 380px; text-align: center;">
      <div style="width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%; background: #fef3c7; display: grid; place-items: center;">
        <span class="material-icons-outlined" style="color: #d97706; font-size: 28px;"></span>
      </div>
      <h3 style="margin: 0 0 8px;">تأكيد الحذف</h3>
      <p style="color: #6b7280; font-size: 0.9rem; margin: 0 0 20px;">سيتم حذف جميع بياناتك نهائياً ولن يمكن استعادتها. هل أنت متأكد؟</p>
      <div class="inline-actions" style="justify-content: center;">
        <button id="modal-confirm-btn" class="btn-danger" type="button">نعم، احذف حسابي</button>
        <button id="modal-cancel-btn" class="btn-primary" type="button">تراجع</button>
      </div>
    </div>
  </div>

  <script src="../assets/vendor/supabase/supabase-js@2.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/security-utils.js"></script>
  <script src="delete-account.js"></script>
</body>
</html>
