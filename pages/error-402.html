<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    background:
      radial-gradient(1100px 550px at 82% -8%, #312e81 0%, transparent 55%),
      radial-gradient(900px 500px at 12% 108%, #1e1b4b 0%, transparent 55%),
      linear-gradient(160deg, #0b1220 0%, #0f172a 100%);
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(110px); opacity: .32; pointer-events: none; }
  .orb.a { width: 480px; height: 480px; background: #6366f1; top: -140px; right: -120px; animation: drift 16s ease-in-out infinite alternate; }
  .orb.b { width: 420px; height: 420px; background: #7c3aed; bottom: -150px; left: -110px; animation: drift 20s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-50px,40px) scale(1.18); } }

  .stage {
    position: relative; z-index: 1;
    width: 100%; max-width: 760px;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 56px 24px;
  }

  .badge402 {
    display: inline-flex; align-items: center; gap: 9px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff; font-weight: 600; font-size: clamp(11px, 2.6vw, 13.5px); letter-spacing: 3px;
    padding: 9px 22px; border-radius: 999px;
    box-shadow: 0 8px 34px rgba(239,68,68,.4);
    margin-bottom: clamp(26px, 5vh, 44px);
    animation: rise .7s cubic-bezier(.2,.8,.25,1) both;
  }
  .badge402 .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1.1s ease-in-out infinite; flex: 0 0 auto; }
  @keyframes blink { 50% { opacity: .25; } }

  .art {
    position: relative;
    width: clamp(150px, 38vw, 215px);
    aspect-ratio: 210 / 165;
    margin-bottom: clamp(6px, 1.5vh, 14px);
    animation: rise .7s .08s cubic-bezier(.2,.8,.25,1) both;
  }
  .art-inner { position: absolute; inset: 0; animation: float 5s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-9px); } }
  .halo {
    position: absolute; inset: -18%;
    background: radial-gradient(closest-side, rgba(124,58,237,.35), transparent 70%);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.15); opacity: .75; } }
  .cloud { position: absolute; inset: auto -3% 8% -3%; height: 58%; filter: drop-shadow(0 14px 26px rgba(0,0,0,.65)); }
  .cloud span {
    position: absolute;
    background: linear-gradient(180deg, #2b3a52, #0b1220);
    border-radius: 999px;
    box-shadow: inset 0 3px 5px rgba(226,232,240,.22);
  }
  .cloud .c1 { width: 83%; height: 29%; bottom: 0; left: 7%; }
  .cloud .c2 { width: 35%; height: 45%; bottom: 10%; left: 16%; }
  .cloud .c3 { width: 30%; height: 38%; bottom: 13%; right: 15%; }
  .bolt {
    position: absolute; top: -3%; left: 50%; transform: translateX(-50%);
    font-size: clamp(42px, 10vw, 64px); color: #fbbf24; z-index: 2;
    text-shadow: 0 0 34px rgba(251,191,36,.85), 0 0 80px rgba(251,191,36,.4);
    animation: zap 2.8s ease-in-out infinite;
  }
  @keyframes zap {
    0%, 86%, 100% { opacity: .4; transform: translateX(-50%) scale(.92); }
    89%, 95% { opacity: 1; transform: translateX(-50%) scale(1.14); }
    92% { opacity: .55; }
  }

  h1 {
    font-size: clamp(27px, 7vw, 46px);
    font-weight: 700; letter-spacing: -.5px;
    line-height: 1.45;
    margin-bottom: clamp(12px, 2.5vh, 22px);
    animation: rise .7s .16s cubic-bezier(.2,.8,.25,1) both;
  }
  h1 .shimmer {
    background: linear-gradient(90deg, #f8fafc 25%, #a5b4fc 50%, #f8fafc 75%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 3.4s linear infinite;
  }
  @keyframes shine { to { background-position: -200% 0; } }

  p.desc {
    font-size: clamp(14.5px, 3.4vw, 18px);
    font-weight: 400; line-height: 2.05;
    color: #94a3b8; max-width: 500px;
    margin-bottom: clamp(26px, 5vh, 40px);
    animation: rise .7s .24s cubic-bezier(.2,.8,.25,1) both;
  }

  .status-line {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: clamp(14px, 3.2vw, 16.5px); font-weight: 600; color: #cbd5e1;
    padding: 12px 24px;
    background: rgba(148,163,184,.07);
    border: 1px solid rgba(148,163,184,.16);
    border-radius: 999px;
    animation: rise .7s .32s cubic-bezier(.2,.8,.25,1) both;
  }
  .st-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; transition: background .3s; }
  .st-down { background: #ef4444; animation: pulseRed 1.7s infinite; }
  .st-check { background: #fbbf24; animation: pulseAmber .9s infinite; }
  .st-back { background: #22c55e; animation: pulseGreen 1.4s infinite; }
  @keyframes pulseRed {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
    70% { box-shadow: 0 0 0 9px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  @keyframes pulseAmber {
    0% { box-shadow: 0 0 0 0 rgba(251,191,36,.55); }
    70% { box-shadow: 0 0 0 8px rgba(251,191,36,0); }
    100% { box-shadow: 0 0 0 0 rgba(251,191,36,0); }
  }
  @keyframes pulseGreen {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); }
    70% { box-shadow: 0 0 0 9px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }

  .brand {
    margin-top: clamp(40px, 8vh, 72px);
    font-size: clamp(13px, 3vw, 15px); font-weight: 700;
    color: #475569; letter-spacing: 6px;
    animation: rise .7s .4s cubic-bezier(.2,.8,.25,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
</style>

<script>

  var PERIOD = 30000;

  var stDot = document.getElementById("stDot");
  var stText = document.getElementById("stText");
  var timer = null;

  function setStatus(mode, text) {
    stDot.className = "st-dot " + mode;
    stText.textContent = text;
  }

  function goHome() { window.location.replace("home.html"); }

  function check() {
    setStatus("st-check", "لحظة من فضلك...");

          setStatus("st-down", "الخدمة متوقفة حاليا");

          setStatus("st-back", "عادت الخدمة للعمل! جاري إعادتك للموقع...");
          setTimeout(goHome, 1800);
          clearTimeout(timer);
        }
      })
      .catch(function () {
        setStatus("st-down", "تعذر الاتصال بالخدمة");

  check();
  timer = setInterval(check, PERIOD);
})();
