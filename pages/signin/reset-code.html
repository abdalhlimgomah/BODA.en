  <link href="../../assets/css/noon-components.css" rel="stylesheet" />
  <link rel="stylesheet" href="signin.css" />
  <link rel="stylesheet" href="../signup/signup.css" />
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="../home.html">
        <span class="material-icons-outlined">shopping_bag</span>
        Buda
      </a>
      <h1 class="auth-title">التحقق من الكود</h1>
      <p class="auth-subtitle">أدخل الكود المرسل إلى بريدك الإلكتروني.</p>
      <p id="auth-feedback" class="status-note hidden" aria-live="polite"></p>

      <div class="verification-info" style="margin-bottom:10px;">
        <p style="margin:0 0 4px;">تم إرسال الكود إلى:</p>
        <p id="reset-email-display" style="margin:0;font-weight:900;color:#102a43;">...</p>
      </div>

      <form id="reset-code-form" class="auth-form">
        <div class="otp-input-container" id="reset-otp-container">
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
        </div>

        <button id="verify-reset-code-btn" type="submit" class="verify-btn">تحقق</button>
      </form>

      <div class="resend-section">
        <button class="resend-btn" id="resend-code-btn" type="button">
          إعادة إرسال الكود
          <span class="countdown" id="reset-countdown" style="display:none;"></span>
        </button>
        <div class="resend-attempts" id="reset-attempts"></div>
      </div>

      <div class="auth-footer">
        <a href="forgot-password.html">تغيير البريد الإلكتروني</a>
      </div>
    </div>
  </div>

  <script src="../../assets/vendor/supabase/supabase-js@2.js"></script>
  <script src="../../assets/js/supabase-client.js?v=20260327-1"></script>
  <script src="../../assets/js/noon-shell.js"></script>
  <script src="../../assets/js/security-utils.js"></script>
  <script src="password-reset.js"></script>
</body>
</html>
