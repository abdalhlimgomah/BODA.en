<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>إعادة تعيين كلمة المرور - BudoQ</title>
  <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/all.min.css" />
  <link href="../../assets/fonts/cairo.css" rel="stylesheet" />
  <link href="../../assets/fonts/inter.css" rel="stylesheet" />
  <link href="../../assets/fonts/material-icons-outlined.css" rel="stylesheet" />
  <link href="../../assets/css/noon-theme.css" rel="stylesheet" />
  <link href="../../assets/css/noon-components.css" rel="stylesheet" />
  <link rel="stylesheet" href="signin.css" />
<link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../../assets/icons/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="../../assets/icons/favicon-64x64.png">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="manifest" href="../../assets/icons/site.webmanifest">
<meta name="theme-color" content="#FFD500">
  <meta property="og:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <meta name="twitter:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="../home.html">
        <span class="material-icons-outlined">shopping_bag</span>
        BudoQ
      </a>
      <h1 class="auth-title">إعادة تعيين كلمة المرور</h1>
      <p class="auth-subtitle">أدخل كلمة مرور جديدة لحسابك.</p>
      <p id="auth-feedback" class="status-note hidden" aria-live="polite"></p>

      <div class="verification-info" style="margin-bottom:10px;">
        <p style="margin:0 0 4px;">سيتم تحديث كلمة المرور للحساب:</p>
        <p id="reset-email-display" style="margin:0;font-weight:900;color:#102a43;">...</p>
      </div>

      <form id="reset-password-form" class="auth-form">
        <div class="auth-field">
          <label for="new-password">كلمة المرور الجديدة</label>
          <div class="input-with-action">
            <input id="new-password" class="auth-input" type="password" minlength="8" autocomplete="new-password" required />
            <button type="button" class="eye" data-toggle-pass="new-password" aria-label="إظهار أو إخفاء كلمة المرور">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label for="confirm-new-password">تأكيد كلمة المرور الجديدة</label>
          <div class="input-with-action">
            <input id="confirm-new-password" class="auth-input" type="password" minlength="8" autocomplete="new-password" required />
            <button type="button" class="eye" data-toggle-pass="confirm-new-password" aria-label="إظهار أو إخفاء كلمة المرور">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button id="reset-password-btn" type="submit" class="auth-btn">حفظ كلمة المرور</button>
      </form>

      <div class="auth-footer">
        <a href="login.html">العودة لتسجيل الدخول</a>
      </div>
    </div>
  </div>

  <script src="../../assets/vendor/supabase/supabase-js@2.js"></script>
  <script src="../../assets/js/supabase-client.js?v=20260812"></script>
  <script src="../../assets/js/noon-shell.js?v=20260808"></script>
  <script src="../../assets/js/security-utils.js"></script>
  <script src="password-reset.js"></script>
</body>
</html>
