<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="description" content="تسجيل الدخول إلى BudoQ - منصة التجارة الإلكترونية المتعددة. قم بتسجيل الدخول للوصول إلى حسابك ومتابعة طلباتك." />
  <meta property="og:title" content="تسجيل الدخول - BudoQ" />

  <title>تسجيل الدخول - BudoQ</title>
  <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/all.min.css" />
  <link href="../../assets/fonts/cairo.css" rel="stylesheet" />
  <link href="../../assets/fonts/inter.css" rel="stylesheet" />
  <link href="../../assets/fonts/material-icons-outlined.css" rel="stylesheet" />
  <link href="../../assets/css/noon-theme.css" rel="stylesheet" />
  <link href="../../assets/css/noon-components.css" rel="stylesheet" />
  <link rel="stylesheet" href="signin.css" />
<link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../../assets/icons/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="../../assets/icons/favicon-64x64.png">

  <meta name="twitter:image" content="https://budoq.com/assets/images/og-image.png" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="../home.html">
        <span class="material-icons-outlined"></span>
        BudoQ
      </a>
      <h1 class="auth-title">تسجيل الدخول</h1>
      <p class="auth-subtitle">أدخل بياناتك للوصول إلى حسابك وطلباتك.</p>
      <p id="auth-feedback" class="status-note hidden" aria-live="polite"></p>

      <form class="auth-form" onsubmit="handleLogIn(event)">
        <div class="auth-field">
          <label for="username">البريد الإلكتروني</label>
          <input class="auth-input" type="email" name="username" id="username" autocomplete="email" required />
        </div>

        <div class="auth-field">
          <label for="password">كلمة المرور</label>
          <div class="input-with-action">
            <input class="auth-input" type="password" name="password" id="password" autocomplete="current-password" required />
            <span id="eye" class="eye"><i class="fa-solid fa-eye"></i></span>
          </div>
        </div>

        <div class="auth-links">
          <label><input type="checkbox" name="remember" checked /> تذكرني</label>
          <a href="forgot-password.html">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="auth-btn">دخول</button>
      </form>

      <div class="auth-footer">
        لا تملك حسابًا؟ <a href="../signup/index.html">إنشاء حساب</a>
      </div>

      <div class="google-wrap">
        <button id="google-signin-btn" class="google-btn" onclick="startGoogleOAuth()">
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.97-5.97z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/></svg>
          <span>Google</span>
        </button>
      </div>
    </div>
  </div>

  <script src="../../assets/vendor/supabase/supabase-js@2.js"></script>
  <script src="../../assets/js/supabase-client.js?v=20260822c"></script>
  <script src="../../assets/js/store.js?v=20260822b"></script>
  <script src="../../assets/js/security-utils.js"></script>
  <script src="../../assets/js/auth.config.js"></script>
  <script src="signin.js"></script>
</body>
</html>
