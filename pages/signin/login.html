<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - Buda</title>
  <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/all.min.css" />
  <link href="../../assets/fonts/cairo.css" rel="stylesheet" />
  <link href="../../assets/fonts/inter.css" rel="stylesheet" />
  <link href="../../assets/fonts/material-icons-outlined.css" rel="stylesheet" />
  <link href="../../assets/css/noon-theme.css" rel="stylesheet" />
  <link href="../../assets/css/noon-components.css" rel="stylesheet" />
  <link rel="stylesheet" href="signin.css" />
<link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../../assets/icons/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="../../assets/icons/favicon-64x64.png">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="manifest" href="../../assets/icons/site.webmanifest">
<meta name="theme-color" content="#FFD500">
  <meta property="og:image" content="https://buda-rho.vercel.app/assets/images/og-image.png" />
  <meta name="twitter:image" content="https://buda-rho.vercel.app/assets/images/og-image.png" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="../home.html">
        <span class="material-icons-outlined"></span>
        Buda
      </a>
      <h1 class="auth-title">تسجيل الدخول</h1>
      <p class="auth-subtitle">أدخل بياناتك للوصول إلى حسابك وطلباتك.</p>
      <p id="auth-feedback" class="status-note hidden" aria-live="polite"></p>

      <form class="auth-form" onsubmit="handleLogIn(event)">
        <div class="auth-field">
          <label for="username">البريد الإلكتروني</label>
          <input class="auth-input" type="email" name="username" id="username" autocomplete="email" required />
        </div>

        <div class="auth-field">
          <label for="password">كلمة المرور</label>
          <div class="input-with-action">
            <input class="auth-input" type="password" name="password" id="password" autocomplete="current-password" required />
            <span id="eye" class="eye"><i class="fa-solid fa-eye"></i></span>
          </div>
        </div>

        <div class="auth-links">
          <label><input type="checkbox" name="remember" checked /> تذكرني</label>
          <a href="forgot-password.html">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="auth-btn">دخول</button>
      </form>

      <div class="auth-footer">
        لا تملك حسابًا؟ <a href="../signup/index.html">إنشاء حساب</a>
      </div>

      <div class="google-wrap" id="google-button-wrap"></div>
    </div>
  </div>

  <script src="../../assets/vendor/supabase/supabase-js@2.js"></script>
  <script src="../../assets/js/supabase-client.js?v=20260327-1"></script>
  <script src="../../assets/js/store.js?v=20260327-1"></script>
  <script src="../../assets/js/security-utils.js"></script>
  <script src="../../assets/js/auth.config.js"></script>
  <script src="signin.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
</body>
</html>
