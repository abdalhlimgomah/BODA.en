                        </div>

                        <div class="pl-filter-group">

                                <span class="material-icons-outlined pl-filter-arrow">expand_less</span>
                            </button>
                            <div class="pl-filter-body">

                                <option value="discount">نسبة الخصم</option>

                                </button>
                                <button class="pl-view-btn" data-view="list" type="button" aria-label="قائمة">
                                    <span class="material-icons-outlined">view_list</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="pl-loading" id="plLoading">

                    </div>

                    </div>

                    <!-- Pagination -->
                    <div class="pl-pagination" id="plPagination"></div>
