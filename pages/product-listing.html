<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>المنتجات - BudoQ</title>
        <link href="../assets/fonts/cairo.css" rel="stylesheet" />
        <link href="../assets/fonts/inter.css" rel="stylesheet" />
        <link href="../assets/fonts/material-icons-outlined.css" rel="stylesheet" />
        <link href="../assets/css/noon-theme.css" rel="stylesheet" />
        <link href="../assets/css/noon-shell.css?v=20260815" rel="stylesheet" />
        <link href="../assets/css/noon-components.css" rel="stylesheet" />
        <link href="../assets/css/desktop.css?v=20260808" rel="stylesheet" />
        <link href="../assets/css/desktop-animations.css?v=20260709" rel="stylesheet" />
        <link href="../assets/css/home.css?v=20260808" rel="stylesheet" />
        <link href="../assets/css/product-listing.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico">
        <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
        <link rel="manifest" href="../assets/icons/site.webmanifest">
        <meta name="theme-color" content="#FFD500">
      <meta property="og:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <meta name="twitter:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
</head>
    <body class="app-shell pl-loading">
                  <!-- ========== HEADER - Noon Style (2 Rows) ========== -->
        <header class="app-header buda-header"></header>

        <nav class="cl-breadcrumb" id="plBreadcrumb">
            <div class="cl-breadcrumb-inner">
                <a href="home.html">الرئيسية</a>
                <span class="cl-breadcrumb-sep">/</span>
                <span class="cl-breadcrumb-current" id="plBreadcrumbCurrent">المنتجات</span>
            </div>
        </nav>

        <main class="pl-page">
            <div class="pl-layout">
                <!-- Mobile Filter Toggle -->
                <button class="pl-filter-toggle" id="plFilterToggle" type="button">
                    <span class="material-icons-outlined">tune</span>
                    <span>تصفية</span>
                    <span class="pl-filter-count" id="plFilterCount">0</span>
                </button>

                <!-- Sidebar Filters (Desktop) -->
                <aside class="pl-sidebar" id="plSidebar">
                    <div class="pl-sidebar-inner">
                        <div class="pl-sidebar-header">
                            <h3>تصفية النتائج</h3>
                            <button class="pl-sidebar-close" id="plSidebarClose" type="button">
                                <span class="material-icons-outlined">close</span>
                            </button>
                        </div>

                        <div class="pl-filter-group">
                            <button class="pl-filter-header" type="button">
                                <span>البحث</span>
                                <span class="material-icons-outlined pl-filter-arrow">expand_less</span>
                            </button>
                            <div class="pl-filter-body">
                                <div class="pl-search-box">
                                    <span class="material-icons-outlined">search</span>
                                    <input type="text" id="plSearchInput" placeholder="ابحث داخل المنتجات..." />
                                </div>
                            </div>
                        </div>

                        <div class="pl-filter-group">
                            <button class="pl-filter-header" type="button">
                                <span>السعر</span>
                                <span class="material-icons-outlined pl-filter-arrow">expand_less</span>
                            </button>
                            <div class="pl-filter-body">
                                <div class="pl-price-range">
                                    <div class="pl-price-inputs">
                                        <div class="pl-price-field">
                                            <label>من</label>
                                            <input type="number" id="plPriceMin" placeholder="0" min="0" />
                                        </div>
                                        <span class="pl-price-dash">-</span>
                                        <div class="pl-price-field">
                                            <label>إلى</label>
                                            <input type="number" id="plPriceMax" placeholder="9999" min="0" />
                                        </div>
                                    </div>
                                    <button class="pl-apply-btn" id="plPriceApply">تطبيق</button>
                                </div>
                            </div>
                        </div>

                        <div class="pl-filter-group">
                            <button class="pl-filter-header" type="button">
                                <span>التصنيف</span>
                                <span class="material-icons-outlined pl-filter-arrow">expand_less</span>
                            </button>
                            <div class="pl-filter-body" id="plFilterCategories"></div>
                        </div>

                        <div class="pl-filter-group">
                            <button class="pl-filter-header" type="button">
                                <span>العلامة التجارية</span>
                                <span class="material-icons-outlined pl-filter-arrow">expand_less</span>
                            </button>
                            <div class="pl-filter-body" id="plFilterBrands"></div>
                        </div>

                        <div class="pl-filter-group">
                            <button class="pl-filter-header" type="button">
                                <span>التقييم</span>
                                <span class="material-icons-outlined pl-filter-arrow">expand_less</span>
                            </button>
                            <div class="pl-filter-body" id="plFilterRating">
                                <label class="pl-radio-label"><input type="radio" name="rating" value="4" /> 4★ فأكثر</label>
                                <label class="pl-radio-label"><input type="radio" name="rating" value="3" /> 3★ فأكثر</label>
                                <label class="pl-radio-label"><input type="radio" name="rating" value="2" /> 2★ فأكثر</label>
                                <label class="pl-radio-label"><input type="radio" name="rating" value="0" checked /> الكل</label>
                            </div>
                        </div>

                        <div class="pl-filter-group">
                            <button class="pl-filter-header" type="button">
                                <span>الخصم</span>
                                <span class="material-icons-outlined pl-filter-arrow">expand_less</span>
                            </button>
                            <div class="pl-filter-body">
                                <label class="pl-radio-label"><input type="radio" name="discount" value="50" /> 50%+</label>
                                <label class="pl-radio-label"><input type="radio" name="discount" value="30" /> 30%+</label>
                                <label class="pl-radio-label"><input type="radio" name="discount" value="10" /> 10%+</label>
                                <label class="pl-radio-label"><input type="radio" name="discount" value="0" checked /> الكل</label>
                            </div>
                        </div>

                        <div class="pl-filter-group">
                            <button class="pl-filter-header" type="button">
                                <span>التوفر</span>
                                <span class="material-icons-outlined pl-filter-arrow">expand_less</span>
                            </button>
                            <div class="pl-filter-body">
                                <label class="pl-check-label"><input type="checkbox" id="plAvailOnly" /> متوفر فقط</label>
                            </div>
                        </div>

                        <button class="pl-clear-all" id="plClearAll">مسح الكل</button>
                    </div>
                </aside>

                <!-- Mobile Filter Drawer -->
                <div class="pl-filter-overlay" id="plFilterOverlay"></div>
                <div class="pl-filter-drawer" id="plFilterDrawer"></div>

                <!-- Main Content -->
                <div class="pl-main">
                    <!-- Top bar -->
                    <div class="pl-top-bar">
                        <div class="pl-results-info">
                            <span id="plResultsCount">0</span> منتج
                        </div>
                        <div class="pl-sort-group">
                            <label for="plSortSelect">ترتيب:</label>
                            <select id="plSortSelect">
                                <option value="default">الأحدث</option>
                                <option value="price-asc">السعر: الأقل أولاً</option>
                                <option value="price-desc">السعر: الأعلى أولاً</option>
                                <option value="rating">التقييم</option>
                                <option value="discount">نسبة الخصم</option>
                                <option value="name">الاسم</option>
                            </select>
                            <div class="pl-view-toggle">
                                <button class="pl-view-btn active" data-view="grid" type="button" aria-label="شبكة">
                                    <span class="material-icons-outlined">grid_view</span>
                                </button>
                                <button class="pl-view-btn" data-view="list" type="button" aria-label="قائمة">
                                    <span class="material-icons-outlined">view_list</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Loading -->
                    <div class="pl-loading" id="plLoading">
                        <div class="pl-loading-spinner"></div>
                    </div>

                    <!-- Product Grid -->
                    <div class="pl-grid" id="plGrid"></div>

                    <!-- Empty State -->
                    <div class="pl-empty" id="plEmpty" style="display:none">
                        <span class="material-icons-outlined pl-empty-icon">search_off</span>
                        <h3>لا توجد منتجات</h3>
                        <p>لم نعثر على منتجات تطابق بحثك. جرب تغيير معايير التصفية.</p>
                        <button class="pl-clear-all" id="plEmptyClear">مسح التصفية</button>
                    </div>

                    <!-- Pagination -->
                    <div class="pl-pagination" id="plPagination"></div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav" id="bottom-nav">
            <a href="home.html" data-nav="home"><span class="material-icons-outlined">home</span><small>الرئيسية</small></a>
            <a href="products.html" data-nav="products" class="is-active"><span class="material-icons-outlined">apps</span><small>المنتجات</small></a>
            <a href="ahsab.html" data-nav="account"><span class="material-icons-outlined">person</span><small>حسابي</small></a>
            <a href="empty-cart.html" data-nav="cart"><span class="material-icons-outlined">shopping_cart</span><small>العربة</small><span class="nav-cart-count nav-cart-0" id="nav-cart-count">0</span></a>
        </nav>

        <script src="../assets/js/noon-shell.js?v=20260810"></script>
        <script src="../assets/js/store.js"></script>
        <script src="../assets/js/pricing-engine.js"></script>
        <script src="../assets/js/taager-integration.js?v=20260810"></script>
        <script src="../assets/js/cart.js?v=20260815"></script>
        <script src="../assets/vendor/supabase/supabase-js@2.js?v=20260810"></script>
        <script src="../assets/js/supabase-client.js?v=20260812"></script>
        <script src="../assets/js/home.js"></script>
        <script src="../assets/js/product-listing.js"></script>
    </body>
</html>
