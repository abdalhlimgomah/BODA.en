<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقارنة - BudoQ</title>
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="">
  <meta property="og:locale" content="ar_AR">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <meta name="twitter:image" content="https://budoq.vercel.app/assets/images/og-image.png" />
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="../assets/css/blog.css">
  <link rel="stylesheet" href="../assets/css/noon.css">
  <script src="../assets/js/seo/seo-utils.js"></script>
</head>
<body>
  <div id="shell-root"></div>

  <div class="blog-page" id="comparison-page">
    <div class="blog-loading" id="comparison-loading">
      <div class="skeleton-loader" style="height:40px;width:60%;margin:0 auto 12px;border-radius:8px"></div>
      <div class="skeleton-loader" style="height:300px;border-radius:16px;margin-bottom:24px"></div>
    </div>
  </div>

  <div id="shell-footer"></div>

  <script src="../assets/js/seo/blog-engine.js"></script>
  <script src="../assets/js/seo/knowledge-center.js"></script>
  <script src="../assets/js/seo/content-engine.js"></script>
  <script src="../assets/js/seo/meta-generator.js"></script>
  <script src="../assets/js/seo/schema-generator.js"></script>
  <script src="../assets/js/seo/seo-engine.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) {
        document.getElementById('comparison-page').innerHTML = '<div class="blog-empty"><span class="material-icons-outlined" style="font-size:64px">error_outline</span><p>المقارنة غير موجودة</p></div>';
        return;
      }

      KnowledgeCenter.getComparisonBySlug(slug).then(function (comparison) {
        if (!comparison) {
          document.getElementById('comparison-page').innerHTML = '<div class="blog-empty"><span class="material-icons-outlined" style="font-size:64px">error_outline</span><p>المقارنة غير موجودة</p></div>';
          return;
        }

        document.getElementById('comparison-loading').style.display = 'none';

        var typeLabels = {
          'product_vs_product': 'مقارنة منتجات',
          'brand_vs_brand': 'مقارنة براندات',
          'category_vs_category': 'مقارنة فئات'
        };

        var html = '<header class="post-header">';
        html += '<span class="guide-card-type guide-type-comparison" style="display:inline-block">' + (typeLabels[comparison.comparison_type] || 'مقارنة') + '</span>';
        html += '<h1>' + KnowledgeCenter.escHtml(comparison.title) + '</h1>';
        if (comparison.subtitle) html += '<p style="color:#64748b;font-size:16px">' + KnowledgeCenter.escHtml(comparison.subtitle) + '</p>';
        html += '</header>';

        if (comparison.image) html += '<img src="' + comparison.image + '" alt="' + KnowledgeCenter.escHtml(comparison.title) + '" class="post-featured-image" loading="lazy">';

        html += '<div id="comparison-table-container"></div>';
        html += '<div class="post-content" id="comparison-content"></div>';

        if (comparison.winner_summary) {
          html += '<div class="comparison-winner" style="background:#dcfce7;border-radius:12px;padding:20px;margin:24px 0;text-align:center">';
          html += '<span class="material-icons-outlined" style="font-size:32px;color:#16a34a;display:block;margin-bottom:8px">emoji_events</span>';
          html += '<h3 style="color:#16a34a;margin-bottom:4px">' + KnowledgeCenter.escHtml(comparison.entity_a_name || comparison.entity_b_name || '') + '</h3>';
          html += '<p style="color:#166534">' + KnowledgeCenter.escHtml(comparison.winner_summary) + '</p>';
          html += '</div>';
        }

        html += '<div id="comparison-faq"></div>';

        document.getElementById('comparison-page').innerHTML = html;

        KnowledgeCenter.renderComparisonTable(comparison, 'comparison-table-container');
        var contentEl = document.getElementById('comparison-content');
        if (contentEl) contentEl.innerHTML = comparison.content_html || comparison.content || '';
        KnowledgeCenter.renderLandingFAQ(comparison, 'comparison-faq');

        document.title = (comparison.meta_title || comparison.title) + ' | مقارنة | BudoQ';
        var canon = document.querySelector('link[rel="canonical"]');
        if (canon) canon.href = window.location.href;

        if (window.MetaGenerator) {
          MetaGenerator.forStaticPage({
            title: comparison.meta_title || comparison.title + ' | مقارنة | BudoQ',
            description: comparison.meta_description || comparison.subtitle || '',
            image: comparison.image || '',
          });
        }

        if (window.SchemaGenerator) {
          SchemaGenerator.injectBreadcrumb([
            { name: 'الرئيسية', url: '/' },
            { name: 'المقارنات', url: '/pages/knowledge-center.html' },
            { name: comparison.title, url: window.location.href },
          ]);
        }
      });
    })();
  </script>
  <script src="../assets/js/noon-shell.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
</body>
</html>
